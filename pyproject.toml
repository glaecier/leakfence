[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "leakfence"
version = "0.1.0"
description = "Lightweight secret detection used as a CI/CD security gate"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
  "ruff>=0.13,<1.0",
]

[tool.setuptools.packages.find]
include = ["leakfence*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
